name: Publish Extension

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.vsix.outputs.filename }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set extension version from release tag
        run: |
          VERSION="$GITHUB_REF_NAME"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/^## Unreleased$/## $VERSION/" CHANGELOG.md

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Record package filename
        id: vsix
        run: echo "filename=chalk-lsp-$(node -p "require('./package.json').version").vsix" >> "$GITHUB_OUTPUT"

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: chalk-vscode-${{ github.ref_name }}
          path: ${{ steps.vsix.outputs.filename }}
          if-no-files-found: error

  publish-vscode:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require Visual Studio Marketplace token
        run: test -n "$VSCE_PAT" || { echo "::error::Missing VSCE_PAT repository secret"; exit 1; }
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Install dependencies
        run: npm ci

      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: chalk-vscode-${{ github.ref_name }}
          path: dist

      - name: Publish to Visual Studio Marketplace
        run: npm run publish:vsce -- --packagePath "dist/${{ needs.package.outputs.vsix }}" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-open-vsx:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require Open VSX token
        run: test -n "$OVSX_PAT" || { echo "::error::Missing OVSX_PAT repository secret"; exit 1; }
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Install dependencies
        run: npm ci

      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: chalk-vscode-${{ github.ref_name }}
          path: dist

      - name: Publish to Open VSX Registry
        run: npm run publish:open-vsx -- "dist/${{ needs.package.outputs.vsix }}" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
